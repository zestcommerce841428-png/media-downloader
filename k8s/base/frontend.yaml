---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mediadl
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: mediadl-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: mediadl-config
          env:
            - name: NEXT_PUBLIC_SUPABASE_URL
              valueFrom:
                secretKeyRef: { name: mediadl-secrets, key: NEXT_PUBLIC_SUPABASE_URL }
            - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef: { name: mediadl-secrets, key: NEXT_PUBLIC_SUPABASE_ANON_KEY }
            - name: SUPER_ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: mediadl-secrets, key: SUPER_ADMIN_EMAIL }
          resources:
            requests: { memory: 256Mi, cpu: 100m  }
            limits:   { memory: 1Gi,   cpu: 500m  }
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: mediadl
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: mediadl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
