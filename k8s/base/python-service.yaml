---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads-pvc
  namespace: mediadl
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  namespace: mediadl
  labels:
    app: python-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-service
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: python-service
    spec:
      containers:
        - name: python-service
          image: mediadl-python-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mediadl-config
          env:
            - name: MAX_CONCURRENT_DOWNLOADS
              value: "5"
            - name: MAX_PAGE_IMAGES
              value: "2000"
            - name: VERIFY_SSL
              value: "true"
          volumeMounts:
            - name: downloads
              mountPath: /downloads
          resources:
            requests: { memory: 512Mi, cpu: 200m  }
            limits:   { memory: 2Gi,   cpu: 1500m }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: mediadl
spec:
  selector:
    app: python-service
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-service-hpa
  namespace: mediadl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
