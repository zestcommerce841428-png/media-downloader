apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namespace: mediadl

# Override image tags for production
images:
  - name: mediadl-backend
    newName: ghcr.io/YOUR_ORG/mediadl-backend
    newTag: latest
  - name: mediadl-frontend
    newName: ghcr.io/YOUR_ORG/mediadl-frontend
    newTag: latest
  - name: mediadl-python-service
    newName: ghcr.io/YOUR_ORG/mediadl-python-service
    newTag: latest

# Production-specific patches
patches:
  # Scale up backend in production
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: backend
  # Scale up frontend in production
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: frontend
  # Production resource limits for backend
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1500m"
    target:
      kind: Deployment
      name: backend

configMapGenerator:
  - name: mediadl-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - WORKER_CONCURRENCY=8
