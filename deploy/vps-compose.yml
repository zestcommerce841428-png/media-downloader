configs:
  mediadl_nginx:
    content: |
      worker_processes auto;
      events { worker_connections 2048; }
      http {
        include /etc/nginx/mime.types;
        sendfile on; server_tokens off; client_max_body_size 200m;
        gzip on; gzip_proxied any; gzip_min_length 1024;
        gzip_types text/css application/json application/javascript image/svg+xml;
        resolver 127.0.0.11 valid=10s ipv6=off;
        map $$http_upgrade $$conn { default upgrade; '' close; }
        server {
          listen 80;
          set $$fe frontend:3000;
          set $$be backend:4000;
          location /socket.io/ { proxy_pass http://$$be; proxy_http_version 1.1; proxy_set_header Host $$host; proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $$scheme; proxy_set_header Upgrade $$http_upgrade; proxy_set_header Connection $$conn; proxy_buffering off; proxy_read_timeout 3600s; proxy_send_timeout 3600s; }
          location /api/ { proxy_pass http://$$be; proxy_http_version 1.1; proxy_set_header Host $$host; proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $$scheme; proxy_set_header Upgrade $$http_upgrade; proxy_set_header Connection $$conn; proxy_buffering off; proxy_read_timeout 3600s; }
          location / { proxy_pass http://$$fe; proxy_http_version 1.1; proxy_set_header Host $$host; proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $$scheme; proxy_set_header Upgrade $$http_upgrade; proxy_set_header Connection $$conn; }
        }
      }
services:
  mysql:
    image: mysql:8.0
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mediadl
      MYSQL_USER: mediadl
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","mediadl","-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [internal]
  redis:
    image: redis:7-alpine
    mem_limit: 512m
    command: redis-server --maxmemory 384mb --maxmemory-policy noeviction --appendonly yes --loglevel warning
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]
  kafka:
    image: apache/kafka:3.7.1
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka_data:/var/lib/kafka/data]
    restart: unless-stopped
    networks: [internal]
  python-service:
    image: ghcr.io/zestcommerce841428-png/mediadl-python:latest
    pull_policy: always
    mem_limit: 4g
    environment:
      REDIS_URL: redis://redis:6379
      DOWNLOAD_DIR: /downloads
      MAX_CONCURRENT_DOWNLOADS: "4"
      DOWNLOAD_TTL_DAYS: "3"
      DEFAULT_BEST_HEIGHT: "1080"
      VERIFY_SSL: "true"
    volumes: [downloads:/downloads]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]
  backend:
    image: ghcr.io/zestcommerce841428-png/mediadl-backend:latest
    pull_policy: always
    mem_limit: 1g
    environment:
      REDIS_URL: redis://redis:6379
      PYTHON_SERVICE_URL: http://python-service:8000
      DOWNLOAD_DIR: /downloads
      PORT: "4000"
      WORKER_CONCURRENCY: "4"
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: mediadl
      MYSQL_USER: mediadl
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      ALLOWED_ORIGINS: https://dl.videodownloaders.cloud
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
      KAFKA_BROKER: kafka:9092
      SMTP_PROVIDER: ${SMTP_PROVIDER}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_ADMIN_TO: ${SMTP_ADMIN_TO}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      HOSTINGER_UPLOAD_URL: ${HOSTINGER_UPLOAD_URL}
      HOSTINGER_DELETE_URL: ${HOSTINGER_DELETE_URL}
      HOSTINGER_API_KEY: ${HOSTINGER_API_KEY}
    volumes: [downloads:/downloads]
    depends_on:
      redis: {condition: service_healthy}
      python-service: {condition: service_healthy}
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]
  frontend:
    image: ghcr.io/zestcommerce841428-png/mediadl-frontend:latest
    pull_policy: always
    mem_limit: 768m
    environment:
      NEXT_PUBLIC_API_URL: ""
      BACKEND_INTERNAL_URL: http://backend:4000
      NEXT_PUBLIC_SITE_URL: https://dl.videodownloaders.cloud
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    networks: [internal]
  nginx:
    image: nginx:1.27-alpine
    mem_limit: 128m
    environment:
      VIRTUAL_HOST: dl.videodownloaders.cloud
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: dl.videodownloaders.cloud
      LETSENCRYPT_EMAIL: admin@api.zestcommerce.in
    configs:
      - source: mediadl_nginx
        target: /etc/nginx/nginx.conf
    depends_on: [frontend, backend]
    restart: unless-stopped
    networks: [internal, proxy]
networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: zync_default
volumes:
  mysql_data:
  redis_data:
  kafka_data:
  downloads:
