worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout  65;
  server_tokens off;
  client_max_body_size 200m;

  # gzip compression for text/JSON/JS/CSS payloads
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/xml image/svg+xml application/rss+xml;

  # Shared cache zone for cacheable upstream responses (e.g. search results)
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=apicache:20m
                   max_size=500m inactive=15m use_temp_path=off;

  # Docker's embedded DNS — re-resolve service IPs at runtime so container
  # restarts (new IPs) never strand nginx with a stale upstream (502).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Rate limiting — 30 req/min per IP for API, 120/min for signed-in (enforced via X-User-Id)
  limit_req_zone $binary_remote_addr zone=api_anon:10m rate=30r/m;
  limit_req_zone $http_x_user_id     zone=api_auth:10m rate=120r/m;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    set $frontend_up frontend:3000;
    set $backend_up  backend:4000;

    # Security headers (dev — no HSTS, permissive CSP for hot-reload)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https: http://localhost:4000; media-src 'self' blob: https: http://localhost:4000; connect-src 'self' wss: ws: https: http://localhost http://localhost:4000 http://localhost:8000 *.supabase.co; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.google.com *.gstatic.com *.googleapis.com pagead2.googlesyndication.com *.tawk.to; frame-src 'self' *.google.com; font-src 'self' data: https://fonts.gstatic.com https:; worker-src 'self' blob:; frame-ancestors 'none';" always;

    # Socket.io — WebSocket + long-polling (must come before /api/ to avoid prefix match)
    location /socket.io/ {
      proxy_pass http://$backend_up;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering    off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # API — proxied to the Express backend
    location /api/ {
      limit_req zone=api_anon burst=20 nodelay;
      proxy_pass http://$backend_up;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # SSE progress stream + WebSocket upgrade support
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # Search results are cacheable & identical per (query, kind, page) — cache 15m
    location = /api/analyze/search {
      proxy_pass http://$backend_up;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_cache apicache;
      proxy_cache_methods POST;
      proxy_cache_key "$request_uri|$request_body";
      proxy_cache_valid 200 15m;
      proxy_cache_use_stale error timeout updating;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Everything else → Next.js frontend (HMR / WS aware)
    location / {
      proxy_pass http://$frontend_up;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
